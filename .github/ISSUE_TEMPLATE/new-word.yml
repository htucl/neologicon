name: Suggest a word
description: Propose a neologism without opening a pull request yourself.
title: "New word: "
labels: [new-word]
body:
  - type: input
    id: word
    attributes:
      label: The word
      placeholder: e.g. sprent
    validations:
      required: true
  - type: dropdown
    id: pos
    attributes:
      label: Part of speech
      options: [noun, verb, adjective, adverb, interjection]
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options: [tactile, sounds, social, bodily, perception, movement, environment, other]
    validations:
      required: true
  - type: textarea
    id: definition
    attributes:
      label: Definition
      placeholder: A one-sentence definition of the word.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example sentence
      placeholder: '"An example sentence using the word."'
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: Credit you as
      placeholder: Your name or handle
